<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatador de Texto e Planilhas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="cabecalho">
    <h2>Formatador de Texto</h2>
    <span class="subtitulo">Produtividade para Planilhas & Web</span>
  </header>

  <main class="conteudo">
    <!-- Área de Entrada de Texto -->
    <div class="grupo-campo">
      <div class="barra-ferramentas-texto">
        <label for="entrada-texto">Texto / Dados:</label>
        <div class="acoes-topo">
          <button id="btn-desfazer" type="button" class="btn-acao-rapida" title="Desfazer (Ctrl+Z)" disabled>↩ Desfazer</button>
          <button id="btn-refazer" type="button" class="btn-acao-rapida" title="Refazer (Ctrl+Y)" disabled>↪ Refazer</button>
          <button id="btn-colar" type="button" class="btn-acao-rapida" title="Colar da Área de Transferência">📋 Colar</button>
        </div>
      </div>

      <!-- Editor: calha com números de linha + realce colorido atrás do campo de texto -->
      <div class="editor" id="editor">
        <div class="calha" id="calha" aria-hidden="true">
          <div class="calha-conteudo" id="calha-conteudo"></div>
        </div>
        <div class="editor-corpo">
          <div class="realce" id="realce" aria-hidden="true">
            <div class="realce-conteudo" id="realce-conteudo"></div>
          </div>
          <textarea id="entrada-texto" wrap="off" spellcheck="false" placeholder="Cole aqui seu texto, lista de CPFs, nomes ou valores..."></textarea>
        </div>
      </div>

      <div class="contador-rodape">
        <span id="contador">Linhas: 0 | Caract.: 0</span>
      </div>

      <!-- Aparece só quando o texto colado tem várias colunas (copiadas da planilha) -->
      <div id="linha-coluna" class="linha-coluna oculto">
        <label for="seletor-coluna">Coluna:</label>
        <select id="seletor-coluna" class="seletor"></select>
      </div>
    </div>

    <!-- Resultado da última ação, problemas e duplicados -->
    <section id="relatorio" class="relatorio" aria-label="Resultado e conferência">
      <p id="resumo-acao" class="resumo oculto" role="status"></p>
      <p id="resumo-duplicados" class="resumo oculto"></p>
      <details id="det-problemas" class="detalhes oculto">
        <summary id="sum-problemas"></summary>
        <ul id="lista-problemas" class="lista-itens"></ul>
      </details>
      <details id="det-duplicados" class="detalhes oculto">
        <summary id="sum-duplicados"></summary>
        <ul id="lista-duplicados" class="lista-itens"></ul>
      </details>
    </section>

    <!-- Seção de Ações: Documentos e Números -->
    <div class="secao-acoes">
      <span class="rotulo-secao">Documentos e Contatos</span>
      <div class="grade-botoes">
        <button id="btn-formatar-cpf" class="btn">Formatar CPF</button>
        <button id="btn-formatar-telefone" class="btn">Telefone / Celular</button>
        <button id="btn-formatar-email" class="btn">Padronizar E-mail</button>
        <button id="btn-apenas-numeros" class="btn">Apenas Números</button>
      </div>

      <!-- Configuração da Máscara de CPF -->
      <div class="linha-mascara">
        <select id="seletor-modo-mascara" class="seletor" aria-label="Modo da máscara de CPF">
          <option value="meio">Máscara: 123.***.***-00</option>
          <option value="pontas">Máscara: ***.456.789-**</option>
          <option value="so_final">Máscara: ***.***.***-00</option>
        </select>
        <button id="btn-mascarar-cpf" class="btn btn-destaque">Mascarar CPF</button>
      </div>
    </div>

    <!-- Seção de Ações: Transformações de Texto -->
    <div class="secao-acoes">
      <span class="rotulo-secao">Formatação de Texto</span>
      <div class="grade-botoes">
        <button id="btn-maiusculas" class="btn">MAIÚSCULAS</button>
        <button id="btn-minusculas" class="btn">minúsculas</button>
        <button id="btn-primeira-maiuscula" class="btn">Primeira maiúscula</button>
        <button id="btn-titulo" class="btn">Cada Palavra Maiúscula</button>
        <button id="btn-remover-acentos" class="btn">Remover Acentos</button>
        <button id="btn-limpar-espacos" class="btn">Limpar Espaços Extras</button>
      </div>
    </div>

    <!-- Seção de Duplicados -->
    <div class="secao-acoes">
      <span class="rotulo-secao">Duplicados</span>
      <p class="dica">As linhas repetidas ficam coloridas no campo acima, automaticamente.</p>
      <div class="linha-mascara">
        <select id="seletor-tipo-duplicado" class="seletor" aria-label="Comparar duplicados como">
          <option value="automatico">Comparar: Automático</option>
          <option value="texto">Comparar: Texto</option>
          <option value="cpf">Comparar: CPF</option>
          <option value="telefone">Comparar: Telefone</option>
          <option value="email">Comparar: E-mail</option>
        </select>
        <button id="btn-remover-duplicadas" class="btn btn-destaque">Remover duplicadas</button>
      </div>
    </div>

    <!-- Botões de Ação Final -->
    <footer class="rodape-acoes">
      <button id="btn-limpar-tudo" class="btn btn-secundario">Limpar</button>
      <button id="btn-copiar" class="btn btn-primario">Copiar Resultado</button>
    </footer>

    <!-- Notificação Flutuante -->
    <div id="alerta-notificacao" class="alerta oculto" role="status">Copiado com sucesso!</div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
